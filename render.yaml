# Render Infrastructure Blueprint for NEXORA Platform
# Backend API + Frontend Static Site

services:
  # NEXORA Backend API
  - type: web
    name: nexora-backend
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: LLM_PROVIDER
        value: mock

      - key: LLM_MODEL
        value: mock-model

      - key: LLM_API_KEY
        value: mock-key

      - key: EMBEDDING_PROVIDER
        value: mock

      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      - key: EMBEDDING_DIMENSION
        value: "1536"

      - key: EMBEDDING_API_KEY
        value: mock-key

  # NEXORA Frontend
  - type: web
    name: nexora-frontend
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false