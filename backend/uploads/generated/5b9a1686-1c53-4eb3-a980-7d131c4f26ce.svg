<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0B0F19" rx="24"/>
  <text x="50" y="50" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">OSI 7-Layer Reference Model</text>
  <text x="50" y="75" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">OSI 7-Layer reference model diagram</text>
  
    <rect x="50" y="100" width="700" height="42" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="50" y="100" width="38" height="42" rx="10" fill="#EC4899"/>
    <text x="69" y="126" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">7</text>
    <text x="105" y="126" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Application Layer</text>
    <text x="420" y="126" fill="#94A3B8" font-family="monospace" font-size="12">HTTP, HTTPS, DNS, SSH, FTP</text>
  
    <rect x="50" y="150" width="700" height="42" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="50" y="150" width="38" height="42" rx="10" fill="#8B5CF6"/>
    <text x="69" y="176" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">6</text>
    <text x="105" y="176" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Presentation Layer</text>
    <text x="420" y="176" fill="#94A3B8" font-family="monospace" font-size="12">SSL/TLS, JPEG, ASCII, Encryption</text>
  
    <rect x="50" y="200" width="700" height="42" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="50" y="200" width="38" height="42" rx="10" fill="#6366F1"/>
    <text x="69" y="226" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5</text>
    <text x="105" y="226" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Session Layer</text>
    <text x="420" y="226" fill="#94A3B8" font-family="monospace" font-size="12">Sockets, RPC, NetBIOS, PPTP</text>
  
    <rect x="50" y="250" width="700" height="42" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="50" y="250" width="38" height="42" rx="10" fill="#3B82F6"/>
    <text x="69" y="276" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="105" y="276" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Transport Layer</text>
    <text x="420" y="276" fill="#94A3B8" font-family="monospace" font-size="12">TCP (Reliable), UDP (Fast Datagrams), Ports</text>
  
    <rect x="50" y="300" width="700" height="42" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="50" y="300" width="38" height="42" rx="10" fill="#06B6D4"/>
    <text x="69" y="326" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="105" y="326" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Network Layer</text>
    <text x="420" y="326" fill="#94A3B8" font-family="monospace" font-size="12">IP (IPv4/IPv6), Routers, ICMP, Routing</text>
  
    <rect x="50" y="350" width="700" height="42" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="50" y="350" width="38" height="42" rx="10" fill="#10B981"/>
    <text x="69" y="376" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="105" y="376" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Data Link Layer</text>
    <text x="420" y="376" fill="#94A3B8" font-family="monospace" font-size="12">Ethernet, MAC Addresses, Switches, PPP</text>
  
    <rect x="50" y="400" width="700" height="42" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="50" y="400" width="38" height="42" rx="10" fill="#F59E0B"/>
    <text x="69" y="426" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    <text x="105" y="426" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Physical Layer</text>
    <text x="420" y="426" fill="#94A3B8" font-family="monospace" font-size="12">Cables, Fiber, Radio Frequencies, Bits (0/1)</text>
  
</svg>