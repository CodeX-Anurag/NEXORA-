<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="NEXORA architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">System Architecture</text>
  <!-- user -->
  <rect x="40" y="210" width="150" height="90" rx="14" fill="#fff" stroke="#94a3b8"/>
  <text x="115" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Student</text>
  <text x="115" y="274" text-anchor="middle" font-size="14" fill="#64748b">Browser</text>
  <!-- frontend -->
  <rect x="260" y="110" width="270" height="300" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="395" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">Frontend</text>
  <text x="395" y="162" text-anchor="middle" font-size="13" fill="#4f46e5">React · Vite · Tailwind CSS</text>
  <rect x="285" y="185" width="220" height="50" rx="10" fill="#fff" stroke="#c7d2fe"/><text x="395" y="216" text-anchor="middle" font-size="15" fill="#1e1b4b">Dashboard · Tasks · Study</text>
  <rect x="285" y="250" width="220" height="50" rx="10" fill="#fff" stroke="#c7d2fe"/><text x="395" y="281" text-anchor="middle" font-size="15" fill="#1e1b4b">Career · Resume · Projects</text>
  <rect x="285" y="315" width="220" height="50" rx="10" fill="#fff" stroke="#c7d2fe"/><text x="395" y="346" text-anchor="middle" font-size="15" fill="#1e1b4b">Analytics · AI Coach</text>
  <!-- backend -->
  <rect x="620" y="110" width="270" height="300" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="755" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">Backend</text>
  <text x="755" y="162" text-anchor="middle" font-size="13" fill="#059669">Node.js · Express</text>
  <rect x="645" y="185" width="220" height="50" rx="10" fill="#fff" stroke="#a7f3d0"/><text x="755" y="216" text-anchor="middle" font-size="15" fill="#064e3b">REST API</text>
  <rect x="645" y="250" width="220" height="50" rx="10" fill="#fff" stroke="#a7f3d0"/><text x="755" y="281" text-anchor="middle" font-size="15" fill="#064e3b">JWT Auth · Middleware</text>
  <rect x="645" y="315" width="220" height="50" rx="10" fill="#fff" stroke="#a7f3d0"/><text x="755" y="346" text-anchor="middle" font-size="15" fill="#064e3b">Logic · AI Service</text>
  <!-- externals -->
  <rect x="990" y="130" width="170" height="90" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="1075" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">MongoDB Atlas</text><text x="1075" y="193" text-anchor="middle" font-size="13" fill="#b45309">via Mongoose</text>
  <rect x="990" y="300" width="170" height="90" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="1075" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#9d174d">Google Gemini</text><text x="1075" y="363" text-anchor="middle" font-size="13" fill="#be185d">AI API</text>
  <!-- arrows -->
  <path d="M190 255 H255" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M530 235 H615" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="572" y="225" text-anchor="middle" font-size="12" fill="#475569">HTTPS / JSON</text>
  <path d="M890 190 H985" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M890 340 H985" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="600" y="470" text-anchor="middle" font-size="14" fill="#475569">The backend is the single controlled gateway between the UI, the database, and the AI provider.</text>
</svg>
