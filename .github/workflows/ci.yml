name: NEXORA Phase 1 CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Lint Backend
        run: npm --prefix backend run lint

      - name: Lint Frontend
        run: npm --prefix frontend run lint

      - name: Test Backend
        run: npm --prefix backend run test
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/nexora_test_db
          CLIENT_URL: http://localhost:5173

      - name: Test Frontend
        run: npm --prefix frontend run test
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

      - name: Build Frontend Application
        run: npm --prefix frontend run build
